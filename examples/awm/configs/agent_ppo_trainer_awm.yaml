# AWM (Agentic World Model) Training Configuration
# 
# This config is specifically designed for training agents on AWM-generated
# virtual environments with MCP-based tool interactions.

hydra:
  searchpath:
    - pkg://verl.trainer.config
    - pkg://rllm.trainer.config

defaults:
  - agent_ppo_trainer
  - _self_

# ============================================================
# Algorithm Configuration
# ============================================================
algorithm:
  adv_estimator: grpo
  kl_ctrl:
    kl_coef: 0.000

# ============================================================
# Task Configuration
# ============================================================
task_configs:
  awm_composite:
    max_prompt_length: 6400
    max_response_length: 15360
    max_steps: 15

# ============================================================
# Data Configuration
# ============================================================
data:
  dataset_name: awm_composite
  dataset_path: Snowflake/AgenticWorldModel
  train_scenarios: 100          # Number of scenarios for training
  test_scenarios: 20            # Number of scenarios for testing
  tasks_per_scenario: 10        # Tasks per scenario (1-10)
  verification_mode: pure_code  # pure_code or sql
  database_dir: ./outputs/awm_databases
  truncation: left
  filter_overlong_prompts: False
  validation_shuffle: false
  
  # Batch sizes
  train_batch_size: 384
  val_batch_size: 512
  gen_batch_size: ${mul:${data.train_batch_size},${rllm.rejection_sample.multiplier}}
  
  # Filter settings
  filter_truncated: true
  filter_overlong: true
  max_prompt_length: 6400
  max_response_length: 15360

# ============================================================
# RLLM Agent Configuration
# ============================================================
rllm:
  agent:
    name: awm_agent
    max_steps: 15               # Maximum interaction steps per episode
    trajectory_timeout: 120     # Timeout per trajectory in seconds
    overlong_filter: true
    parser_name: qwen           # Parser for tool calls
    engine_args:
      temperature: 0.6
      top_p: 0.9
      max_tokens: 2048
    
  env:
    name: awm_env
    env_args:
      server_start_timeout: 30.0
      server_host: 127.0.0.1
  
  workflow:
    use_workflow: false
    name: multi_turn_workflow
    workflow_args:
      agent_cls: null
      agent_args: {}
      env_cls: null
      env_args: {}
      timeout: 1e6
      gamma: 0.0
      reward_bonus_coeff: 0.0
    n_parallel_tasks: 64        # Reduced for AWM server startup overhead
    retry_limit: 2
  
  # Thinking mode
  disable_thinking: false
  accumulate_reasoning: true
  mask_truncated_samples: true
  
  # Stepwise advantage
  stepwise_advantage:
    enable: true
    mode: broadcast
    normalize_by_steps: true
  
  # Compact filtering
  compact_filtering:
    enable: true
    mask_max_prompt_length_exceeded: true
    mask_max_response_length_exceeded: true
    mask_env_done: false
    mask_max_turns_exceeded: true
    mask_timeout: true
    mask_unknown: false
    mask_error: true
  
  # Rejection sampling
  rejection_sample:
    enable: true
    multiplier: 2
  
  # Length penalty (Kimi K1.5 style)
  length_penalty:
    enable: false
    weight: 0.1
    warmup_steps: 0
    min_response_length: 200
  
  # Simple length penalty (disabled by default)
  simple_length_penalty:
    enable: false
    baseline_len: 2048
    coefficient: 0.1
    max_penalty: 0.2
    warmup_steps: 25

# ============================================================
# Actor/Rollout Configuration
# ============================================================
actor_rollout_ref:
  model:
    path: Qwen/Qwen2.5-7B-Instruct  # Base model
    enable_gradient_checkpointing: true
    use_remove_padding: True
  
  actor:
    strategy: fsdp
    optim:
      lr: 1e-6
      lr_scheduler: cosine
      warmup_steps: 100
    loss_agg_mode: seq-mean-token-mean
    ppo_mini_batch_size: 2
    use_dynamic_bsz: True
    ppo_max_token_len_per_gpu: 32000
    use_kl_loss: False
    kl_loss_coef: 0.0
    kl_loss_type: low_var_kl
    ulysses_sequence_parallel_size: 1
    entropy_coeff: 0.0
    grad_clip: 1.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    fsdp_config:
      param_offload: True
      optimizer_offload: True
    
  rollout:
    name: vllm
    mode: async
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.6
    enforce_eager: False
    temperature: 1.0
    n: 8
    repetition_penalty: 1.05
    log_prob_micro_batch_size_per_gpu: 1
    agent:
      num_workers: 4              # Number of parallel rollout workers
    val_kwargs:
      n: 1
      do_sample: false
      temperature: 0.0
    
  ref:
    fsdp_config:
      param_offload: True
    log_prob_micro_batch_size_per_gpu: 1

# ============================================================
# Critic Configuration
# ============================================================
critic:
  model:
    path: Qwen/Qwen2.5-7B-Instruct
  strategy: fsdp
  optim:
    lr: 1e-5
    lr_scheduler: cosine
    warmup_steps: 100

# ============================================================
# Trainer Configuration
# ============================================================
trainer:
  project_name: rllm-multitask-agent
  experiment_name: awm-7b-ppo
  n_gpus_per_node: 8
  nnodes: 1
  critic_warmup: 0
  
  # Training settings
  total_epochs: 10
  total_training_steps: null
  
  # Logging
  log_episodes: true
  episode_log_dir: logs/${trainer.project_name}/${trainer.experiment_name}
  log_freq: 10
  
  # Checkpointing
  save_freq: 100
  save_checkpoint_path: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  
  # Evaluation
  val_freq: 25
  val_before_train: true
  val_only: false
  save_freq: 25
  test_freq: 25

# ============================================================
# Logging Configuration
# ============================================================
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    - console
    - file