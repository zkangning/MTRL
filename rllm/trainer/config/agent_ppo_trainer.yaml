hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

actor_rollout_ref:
  rollout:
    mode: async
    agent:
      num_workers: 0
    val_kwargs:
      do_sample: True

data:
  gen_batch_size: ${mul:${data.train_batch_size},${rllm.rejection_sample.multiplier}}

rllm:
  agent:
    name: math_agent
    max_steps: 20
    trajectory_timeout: null
    overlong_filter: False
    agent_args: {}
    engine_args: {}
  env:
    name: custom
    env_args: {}
  workflow:
    use_workflow: False
    name: single_turn_workflow
    workflow_args:
      agent_cls: null
      agent_args: {}
      env_cls: null
      env_args: {}
      timeout: 1e6
      gamma: 0.0 # no discounting
      reward_bonus_coeff: 0.0 # no reward shaping
    n_parallel_tasks: 256
    retry_limit: 3
  disable_thinking: False
  accumulate_reasoning: False
  mask_truncated_samples: False
  stepwise_advantage:
    enable: False
    mode: broadcast # [broadcast, per_step]
    normalize_by_steps: False
  compact_filtering:
    enable: False
    mask_max_prompt_length_exceeded: True
    mask_max_response_length_exceeded: True
    mask_env_done: False
    mask_max_turns_exceeded: True
    mask_timeout: True
    mask_unknown: False
    mask_error: True
  rejection_sample:
    enable: False
    multiplier: 1
  # Modified Kimi K1.5 style length penalty for tool_call tasks
  # Reference: Kimi K1.5 Technical Report (with fix for reward hacking)
  #
  # IMPORTANT: This penalty is ONLY applied to CORRECT answers to encourage
  # shorter correct responses. Incorrect answers receive NO length penalty.
  #
  # This prevents reward hacking where the model learns "short wrong is better
  # than long wrong", which would cause output length to collapse.
  #
  # Formula: λ = 0.5 - (len - min_len) / (max_len - min_len)
  #   - Correct + Short → positive reward (+λ)
  #   - Correct + Long  → negative penalty (-λ)
  #   - Incorrect       → no length effect (0)
  length_penalty:
    enable: True            # Set to True to enable length penalty
    weight: 0.1             # Weight for length penalty (recommended: 0.05-0.2)
                            # Final length reward = λ * weight, where λ ∈ [-0.5, 0.5]
                            # With weight=0.1, actual reward adjustment is [-0.05, +0.05]
    warmup_steps: 0         # Number of steps before applying length penalty (0 = apply from start)
    min_response_length: 200 # Minimum response length (tokens) to receive length bonus
                            # Responses shorter than this get no length bonus (prevents degenerate outputs)

fireworks:
  deployment_id: null
  model_id_prefix: test-model
  concurrency: 32

trainer:
  log_episodes: false
  episode_log_dir: logs/${trainer.project_name}/${trainer.experiment_name}